<style>
:root{color-scheme:dark;--bg:#06182b;--c:#0c2a45;--ink:#e6f4f7;--mut:#8fb3c4;--ac:#2ec4b6;--co:#ff7f6b;--ln:#17405f;--ok:#4ade80;--wa:#f4b942;--ba:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#toast{color:var(--wa);min-height:20px;padding:0 12px;max-width:900px;margin:auto}.species-photo{width:100%;max-height:230px;object-fit:cover;border-radius:10px;background:#071f35;margin:8px 0}.photo-wrap{min-height:40px}.feed{background:#071f35;border-radius:10px;padding:10px;margin:10px 0}.feed b{color:var(--ac)}

.pk input{margin:0 0 8px}.chs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.ch{white-space:nowrap;background:#071f35;color:var(--ink);border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.ch.on{background:var(--ac);color:#04222a;border-color:var(--ac)}

:root{--bg:#03112a;--c:#0a2748;--ln:#14507a;--ac:#35d6ff;--co:#ff9a3c;--ink:#eaf6ff;--mut:#8fb8d4}

.k{background:rgba(5,24,46,.8);border:1px solid rgba(53,214,255,.22)}.k b{color:#fff;text-shadow:0 0 8px rgba(53,214,255,.4)}
.b{background:linear-gradient(135deg,#35d6ff,#1b8cff);color:#021426;box-shadow:0 0 14px rgba(53,214,255,.45)}
.x{border-color:rgba(53,214,255,.4);color:#bfe6ff}

.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.gc{padding:8px 4px 6px;text-align:center}.gc svg{width:100%;max-width:120px}.gt{font-size:12px;font-weight:600}.gs{font-size:10px;color:var(--mut)}
.nf{display:flex;justify-content:space-between;align-items:center}.nf b{font-size:34px;letter-spacing:1px;color:#fff;text-shadow:0 0 12px rgba(53,214,255,.6)}.nf .ic{font-size:38px;filter:drop-shadow(0 0 8px rgba(53,214,255,.6))}
.hsr{display:flex;gap:8px;overflow-x:auto}.hs{flex:0 0 84px;text-align:center;font-size:11px;cursor:pointer}.hs img,.hs .ph{width:84px;height:62px;object-fit:cover;border-radius:10px;border:1px solid rgba(53,214,255,.35);display:flex;align-items:center;justify-content:center;font-size:26px;background:#0a2a45}
.pm{display:flex;align-items:center;gap:6px;background:rgba(5,24,46,.8);border-radius:10px;padding:8px;font-size:13px}.pm i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor;flex:none}.pm b{margin-left:auto;color:#fff}
.lg{font-size:12px;display:flex;gap:12px;margin-top:4px}

<header><h1>Reef<span>Keeper</span></h1><select id="sel" aria-label="Acuario"></select></header>
<nav id="nav"></nav><div id="toast" role="status"></div><main id="v"></main>
<footer>Los datos se guardan solo en este navegador. Los rangos y datos de especies son orientativos y de demostración: contrástalos con fuentes especializadas. Que no haya alertas no garantiza que el acuario esté sano: observa a los animales.</footer>
<script>
const K='reefkeeper_v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fm=(n,d=1)=>isFinite(n)?Number(n).toLocaleString('es-ES',{maximumFractionDigits:d}):'—';
let S={cur:null,tanks:[]},tab='panel',selSp='ocellaris',selPar='no3',creating=false,delAsk=false;
try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.tanks)S=x}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(window._rt);window._rt=setTimeout(()=>{if(typeof resched==='function')resched()},1500)};
const T=()=>S.tanks.find(t=>t.id===S.cur);
const toast=m=>{$('#toast').textContent=m;setTimeout(()=>{$('#toast').textContent=''},4000)};
const AG=['Muy pacífico','Pacífico','Moderadamente territorial','Territorial','Agresivo','Muy agresivo'];
const SP=[
{id:'ocellaris',n:'Pez payaso ocellaris',c:'Amphiprion ocellaris',tipo:'pez',ag:2,vol:100,tam:11,grp:'Amphiprion',nota:'Suele vivir en pareja y defiende su zona.'},
{id:'regal',n:'Cirujano regal',c:'Paracanthurus hepatus',tipo:'pez',ag:1,vol:400,tam:30,grp:'Paracanthurus',nota:'Muy activo: necesita mucho espacio para nadar.'},
{id:'yellow',n:'Cirujano amarillo',c:'Zebrasoma flavescens',tipo:'pez',ag:3,vol:400,tam:20,grp:'Zebrasoma',nota:'Territorial, sobre todo con otros cirujanos.'},
{id:'fridmani',n:'Pseudocromis fridmani',c:'Pseudochromis fridmani',tipo:'pez',ag:3,vol:100,tam:7,grp:'Pseudochromis',nota:'Necesita grietas y refugios en las rocas.'},
{id:'bicolor',n:'Ángel bicolor',c:'Centropyge bicolor',tipo:'pez',ag:3,vol:300,tam:15,grp:'Centropyge',nota:'En algunos acuarios pica corales y almejas.'},
{id:'cyanea',n:'Damisela azul',c:'Chrysiptera cyanea',tipo:'pez',ag:3,vol:100,tam:8,grp:'Chrysiptera',nota:'Pequeña pero territorial.'},
{id:'gramma',n:'Gramma real',c:'Gramma loreto',tipo:'pez',ag:2,vol:100,tam:8,grp:'Gramma',nota:'Prefiere cuevas y salientes.'},
{id:'mandarin',n:'Pez mandarín',c:'Synchiropus splendidus',tipo:'pez',ag:0,vol:200,tam:8,grp:'Synchiropus',nota:'Dieta especializada; mantenimiento difícil.'},
{id:'emperor',n:'Ángel emperador',c:'Pomacanthus imperator',tipo:'pez',ag:4,vol:1000,tam:40,grp:'Pomacanthus',nota:'Necesita un acuario muy grande; no apto para arrecife.'},
{id:'shrimp',n:'Camarón limpiador',c:'Lysmata amboinensis',tipo:'inv',ag:1,vol:75,tam:6,grp:'Lysmata',nota:'Sensible al cobre y a cambios de salinidad.'},
{id:'bubble',n:'Anémona de punta de burbuja',c:'Entacmaea quadricolor',tipo:'anem',ag:2,vol:300,tam:30,grp:'Entacmaea',host:1,nota:'Anémona hospedadora habitual de peces payaso; necesita mucha luz.'},
{id:'magnifica',n:'Anémona magnífica',c:'Heteractis magnifica',tipo:'anem',ag:2,vol:500,tam:50,grp:'Heteractis',host:1,nota:'Grande y exigente; necesita luz intensa y agua muy estable.'},
{id:'haddoni',n:'Anémona alfombra',c:'Stichodactyla haddoni',tipo:'anem',ag:3,vol:500,tam:60,grp:'Stichodactyla',host:1,nota:'Grande y delicada; puede capturar peces pequeños. Solo para expertos.'},
{id:'condy',n:'Anémona del Caribe',c:'Condylactis gigantea',tipo:'anem',ag:2,vol:300,tam:30,grp:'Condylactis',nota:'Es del Atlántico: no es hospedadora natural de los payasos del Indo-Pacífico.'}];
const FEED={
ocellaris:'Omnívoro: pequeñas porciones de pellets marinos de calidad, mysis, artemia y alimento congelado variado. 1–2 tomas pequeñas al día; retirar sobrantes.',
regal:'Principalmente herbívoro: ofrecer varias veces al día algas marinas (nori apto para acuarios), pellets vegetales y alimentos congelados variados. Necesita aporte vegetal frecuente.',
yellow:'Herbívoro: algas marinas/nori, pellets con espirulina y alimento vegetal. Ofrecer pequeñas raciones vegetales varias veces al día; no basar la dieta solo en carne.',
fridmani:'Carnívoro: mysis, artemia enriquecida y pellets marinos pequeños ricos en proteína. Una o dos tomas pequeñas al día, adaptadas a su aceptación.',
bicolor:'Omnívoro con fuerte componente de esponjas y algas: pellets/formulaciones marinas variadas, algas y congelados. Puede picar corales; vigilar su condición y alimentación.',
cyanea:'Omnívoro: pellets marinos pequeños, mysis y artemia; complementar con alimento vegetal. Pequeñas porciones 1–2 veces al día.',
gramma:'Carnívoro/planctívoro: mysis, artemia y pellets pequeños de calidad. Dar porciones pequeñas 1–2 veces al día.',
mandarin:'Se alimenta continuamente de pequeños crustáceos (copépodos) vivos en roca madura. Solo introducir en sistema maduro con abundante microfauna o si está confirmado que acepta alimento preparado; puede morir de hambre aunque parezca picotear.',
emperor:'Omnívoro: dieta marina variada con esponja, algas y alimentos congelados/pellets específicos para peces ángel grandes. Varias tomas pequeñas; requiere acuario enorme y no es seguro para arrecife.',
shrimp:'Omnívoro carroñero: mysis, artemia, pellets hundibles y restos adecuados de comida. Alimentar con moderación y asegurarse de que recibe alimento, sin depender únicamente de la limpieza.',
bubble:'Simbiótica fotosintética: la iluminación adecuada cubre gran parte de sus necesidades. Si está estable, ofrecer ocasionalmente trocitos pequeños de mysis o marisco marino; no forzar ni sobrealimentar.',
magnifica:'Obtiene energía de la luz y de algas simbióticas; necesita iluminación intensa y estable. Puede aceptar pequeñas porciones ocasionales de alimento marino, pero no sustituye una iluminación correcta.',
haddoni:'Fotosintética y depredadora: iluminación apropiada y, ocasionalmente, pequeñas porciones de pescado/marisco marino. No dar trozos grandes ni alimentar en exceso; puede capturar peces.',
condy:'Fotosintética y carnívora: buena iluminación y, de forma ocasional, pequeños trozos de alimento marino como mysis o marisco. No sobrealimentar; no es hospedadora natural de los peces payaso del Indo-Pacífico.'
};
const FEED2={
ocellaris:['Omnívoro: pellets o gránulos marinos pequeños de calidad, mysis, artemia y otros congelados variados.','1–2 tomas pequeñas al día; lo que coma en 1–2 minutos.','Retira lo que sobre y no sobrealimentes: la comida de más empeora el agua.'],
regal:['Mayormente herbívoro: nori o algas marinas, pellets o escamas con espirulina y algo de congelado (mysis, artemia).','Varias raciones pequeñas al día; pica casi de forma continua.','Necesita aporte vegetal a diario; no bases su dieta solo en carne.'],
yellow:['Herbívoro: algas marinas o nori, pellets con espirulina y alimento vegetal. Las algas de la roca viva le ayudan.','Algas casi a diario, más 1–2 tomas pequeñas de pellets.','Una dieta sin vegetal lo debilita; vigila que otros peces no le quiten la comida.'],
fridmani:['Carnívoro: mysis, artemia enriquecida, trocitos de pescado o marisco y pellets pequeños ricos en proteína.','1–2 tomas pequeñas al día.','Es territorial: comprueba que come bien aunque haya otros peces.'],
bicolor:['Omnívoro: algas, esponjas y alimentos marinos variados; hay mezclas congeladas para peces ángel, además de pellets y nori.','1–2 tomas al día y algas disponibles con regularidad.','Puede picar corales y almejas: una dieta variada y suficiente reduce el riesgo, pero no lo elimina.'],
cyanea:['Omnívoro: pellets marinos pequeños, mysis y artemia, con algo de alimento vegetal.','1–2 tomas pequeñas al día.','Muy territorial: asegúrate de que los demás peces también llegan a la comida.'],
gramma:['Carnívoro: mysis, artemia, copépodos y pellets pequeños de calidad.','1–2 tomas pequeñas al día.','Puede quedar en desventaja ante peces más rápidos: reparte la comida por distintas zonas.'],
mandarin:['Se alimenta de pequeños crustáceos vivos (copépodos y anfípodos) que picotea en la roca viva. Algunos ejemplares aceptan mysis o artemia congelada, otros no.','Picotea todo el día: necesita microfauna constante.','Solo en un sistema maduro con mucha microfauna o si está comprobado que acepta alimento preparado: puede pasar hambre aunque parezca picotear. Es el más delicado de la lista.'],
emperor:['Omnívoro: esponjas, algas y alimentos marinos variados; mezclas congeladas para ángeles grandes, mysis, marisco y nori.','Varias tomas pequeñas al día.','Genera muchos residuos: necesita filtración potente y un acuario enorme. No es apto para arrecife.'],
shrimp:['Omnívoro carroñero: mysis, artemia, pellets que se hundan y restos de la comida de los peces.','Comparte las raciones de los peces; comprueba que le llega comida.','No dependas solo de que «limpie» a los peces. Es sensible al cobre y a los cambios de salinidad.'],
bubble:['Obtiene gran parte de su energía de la luz, gracias a las algas que lleva dentro. Ocasionalmente, un trocito pequeño de mysis, marisco o pescado marino.','Un trocito 1–2 veces por semana como máximo, solo si está sana y abierta.','No la fuerces ni la sobrealimentes. Si se cierra o cambia de color, revisa luz y parámetros antes de darle más comida.'],

haddoni:['Fotosintética y depredadora: luz adecuada y, ocasionalmente, trocitos pequeños de pescado o marisco marino.','Como mucho 1 vez por semana, con trozos pequeños.','Puede capturar peces pequeños. La comida no sustituye a la luz. Solo para expertos.'],
condy:['Fotosintética y carnívora: buena luz y trocitos pequeños de mysis, marisco o pescado marino.','Como mucho 1 vez por semana.','No la sobrealimentes. No es hospedadora natural de los peces payaso del Indo-Pacífico.']};
function feedH(id){const f=FEED2[id];if(!f)return '<b>Alimentación</b><br>'+esc(FEED[id]||'Dieta específica: consulta una ficha fiable de la especie y adapta las raciones a su tamaño y condición.');
return '<b>Alimentación</b><br><b>Qué dar:</b> '+esc(f[0])+'<br><b>Cuánto y cuándo:</b> '+esc(f[1])+'<br><b>Ojo:</b> '+esc(f[2])+'<br><small class="mu">Orientativo: adapta las raciones a cada ejemplar y observa si come y si sobra comida.</small>'}
const DIFL=['','Fácil','Moderada','Difícil','Solo expertos'],DIFC=['','ok','wa','ba','ba'];
const DIF={
ocellaris:[1,"Resistente y de los más adecuados para empezar; suele aceptar alimento preparado."],
regal:[2,"Necesita mucho espacio y es sensible al estrés y a enfermedades como el punto blanco: exige cuarentena y agua estable."],
yellow:[2,"Necesita un acuario grande, algas en la dieta y cuarentena; puede enfermar si se estresa."],
fridmani:[1,"Resistente y acepta alimento preparado; el reto es su territorialidad."],
bicolor:[2,"Requiere un acuario maduro con roca viva y dieta variada; puede picar corales."],

haddoni:[4,"Muy delicada y de gran tamaño; solo para expertos con acuarios muy estables."],

function speciesPhoto(s){if(IMG[s.id])return `<div class="photo-wrap"><img class="species-photo" alt="${esc(s.n)}" src="${IMG[s.id]}"></div>`;return `<div class="photo-wrap" data-photo="${s.id}"><p class="mu"><small>Buscando fotografía de ${esc(s.n)}…</small></p></div>`}
function loadSpeciesImages(){document.querySelectorAll('[data-photo]').forEach(async el=>{const id=el.dataset.photo,s=SP.find(x=>x.id===id);if(!s||el.dataset.loaded)return;el.dataset.loaded='1';try{if(!imageCache[id]){const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(s.c));if(!r.ok)throw Error();const d=await r.json();imageCache[id]=d.thumbnail?.source||null}const src=imageCache[id];el.innerHTML=src?`<img class="species-photo" loading="lazy" alt="${esc(s.n)}" src="${src}"><small class="mu">Imagen: Wikipedia · <a style="color:var(--ac)" target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/${encodeURIComponent(s.c.replaceAll(' ','_'))}">ver fuente</a></small>`:`<p class="mu">No se encontró imagen automática. ${ph(s)}</p>`}catch(e){el.innerHTML=`<p class="mu">Imagen no disponible sin conexión. ${ph(s)}</p>`}})}
const PD={temp:['Temperatura','°C',24,26,20,30],sal:['Salinidad','ppt',33,36,30,38],ph:['pH','',8,8.4,7.8,8.6],kh:['KH','dKH',7,11,6,13],ca:['Calcio','mg/L',400,450,350,500],mg:['Magnesio','mg/L',1250,1350,1100,1500],nh3:['Amoníaco total','mg/L',0,.05,0,.1],no2:['Nitrito','mg/L',0,.05,0,.1],no3:['Nitrato','mg/L',0,10,0,25],po4:['Fosfato','mg/L',0,.1,0,.3]};
const TYPES=['Solo peces','Arrecife mixto','SPS','LPS','Blandos','Nanoarrecife','Cuarentena','Refugio'];
const dTasks=()=>[['Cambio de agua',14],['Comprobar salinidad',7],['Limpiar cristales',7],['Limpiar skimmer',7],['Revisar bombas',30],['Cambiar material filtrante',30],['Mantenimiento de ósmosis inversa',90],['Calibrar sondas',30]].map(([n,e])=>({id:uid(),n,e,last:today()}));
const ph=s=>`<a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(s.c)}" target="_blank" rel="noopener" style="color:var(--ac)">📷 Ver fotos</a>`;
const LB={ok:'Generalmente favorable',wa:'Compatibilidad condicionada',ba:'Alto riesgo',mu:'Información insuficiente'};

function vol(t){const n=x=>+x||0;let g,base=0;
 if(t.shape==='cil'){base=Math.PI*(n(t.l)/2)**2;g=base*n(t.h)/1000}
 else if(t.shape==='cub'){base=n(t.l)**2;g=base*n(t.l)/1000}
 else if(t.shape==='man'){g=n(t.manual)}
 else{base=n(t.l)*n(t.a);g=base*n(t.h)/1000}
 const gap=base*n(t.borde)/1000,net=Math.max(0,g-gap-n(t.sust)-n(t.rocas)-n(t.equip)),eff=n(t.real)>0?n(t.real):net,sump=n(t.s0)+n(t.s1)+n(t.s2)+n(t.s3);
 return{g,gap,net,eff,sump,tot:eff+sump}}

function comp(a,b){const R=(k,m,c)=>({k,m,c:c||''});
 if(a.ag==null||b.ag==null)return R('mu','Faltan datos de comportamiento de una de las especies.','Consulta fuentes especializadas antes de decidir.');
 const fa=a.tipo==='pez',fb=b.tipo==='pez',OK=R('ok','No se prevé un conflicto importante con los datos disponibles.');
 if(a.tipo==='anem'||b.tipo==='anem'){const an=a.tipo==='anem'?a:b,o=an===a?b:a;
  if(o.tipo==='anem')return o.id===an.id?R('wa','Misma especie: pueden fusionarse o competir por el espacio según el caso.','Introducir ejemplares pequeños y dejar mucha distancia entre ellos.'):R('ba','Anémonas de especies distintas suelen picarse y competir por el espacio.','Evita mantener especies distintas juntas salvo en acuarios muy grandes.');
  if(o.grp==='Amphiprion')return an.host?R('wa','Pueden formar simbiosis, pero no siempre ocurre y a veces el pez ignora a la anémona.','Introducir primero la anémona en un acuario maduro y estable, y no forzar la relación.'):R('wa','Esta anémona no es hospedadora natural de este pez payaso.','Observar de cerca: no es una pareja natural.');
  if(o.tipo==='inv')return R('wa','Una anémona puede capturar invertebrados pequeños que se acerquen.','Vigilar al invertebrado y dejar espacio.');
  return an.id==='haddoni'?R('wa','Esta anémona puede capturar peces pequeños.','Evitar peces pequeños cerca y alimentar bien a todos.'):OK}
 if(fa&&fb){
  if(a.id===b.id)return a.ag>=3?R('ba','Dos ejemplares de una especie territorial suelen pelear entre sí.','Solo en acuarios muy amplios con muchos refugios; lo más seguro es un único ejemplar.'):R('wa','Misma especie: pueden formar pareja o pelear según el sexo y la edad.','Introducir juveniles juntos o una pareja ya formada, con refugios suficientes.');
  if(a.grp===b.grp&&Math.max(a.ag,b.ag)>=2)return R('ba','Mismo género y comportamiento territorial: compiten directamente por el espacio.','Evita combinarlos salvo en acuarios muy grandes y con seguimiento.');
  const mx=Math.max(a.ag,b.ag),mn=Math.min(a.ag,b.ag);
  if(mx>=4)return R('ba','Una de las especies es agresiva y puede acosar o dañar a la otra.','Evitar la combinación.');
  if(mx>=3&&mn>=3)return R('wa','Ambas son territoriales y pueden disputarse el espacio.','Acuario amplio, rocas que rompan la línea de visión e introducir la más territorial en último lugar.');
  if(mx>=3&&mn<=1)return R('wa','La especie territorial puede acosar a la más pacífica.','Refugios abundantes, introducir la más territorial en último lugar y vigilar la alimentación.');
  return OK}
 if(fa!==fb){const f=fa?a:b;
  if(f.ag>=4)return R('ba','El pez agresivo puede atacar al invertebrado.','Evitar la combinación.');
  if(f.ag>=3)return R('wa','Los peces territoriales pueden molestar a los invertebrados.','Refugios suficientes y vigilancia durante las primeras semanas.')}
 return OK}
const res=(a,b)=>{const r=comp(a,b);return `<div class="r ${r.k}"><b>${esc(b.n)}</b> <span class="bd ${r.k}">${LB[r.k]}</span><div>${esc(r.m)}</div>${r.c?`<div class="mu">Para reducir riesgos: ${esc(r.c)}</div>`:''}${r.k!=='ok'?'<div class="mu">Señales de problema: persecuciones, aletas dañadas, animales escondidos o que no comen.</div>':''}</div>`};

const readings=(t,k)=>t.params.filter(p=>p.k===k).sort((x,y)=>x.d<y.d?-1:1);
function alerts(t){const o=[];for(const k in PD){const a=readings(t,k);if(!a.length)continue;const l=a[a.length-1],[n,u,mn,mx,dmn,dmx]=PD[k],v=l.v,rg=`objetivo orientativo ${mn}–${mx} ${u}`;
 if(v<dmn||v>dmx)o.push(['ba',`${n}: ${fm(v,3)} ${u} es potencialmente peligroso (${rg}). Repite la medición con otro test, busca la causa y corrige de forma gradual.`]);
 else if(v<mn||v>mx)o.push(['wa',`${n}: ${fm(v,3)} ${u} está fuera del objetivo (${rg}). Verifica la medición y evalúa la causa antes de actuar.`]);
 if(a.length>1){const p=a[a.length-2],dd=Math.abs(v-p.v),days=(new Date(l.d)-new Date(p.d))/864e5,lim=k==='ph'?.3:(k==='temp'||k==='sal')?2:p.v*.2;
  if(days<=3&&p.v>0&&dd>lim)o.push(['wa',`${n}: cambio brusco (${fm(p.v,3)} → ${fm(v,3)} ${u}). Confirma la medición y evita correcciones bruscas.`])}}
 return o}
const alH=t=>{const a=alerts(t);return a.length?a.map(([k,m])=>`<div class="r ${k}">${esc(m)}</div>`).join(''):'<p class="mu">Sin alertas con los datos registrados.</p>'};
function chart(a,k){if(a.length<2)return '<p class="mu">Registra al menos dos mediciones para ver la gráfica.</p>';
 const r=a.slice(-20),vs=r.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=(mx-mn)||1,w=320,h=110;
 const pts=r.map((x,i)=>`${10+i*(w-20)/(r.length-1)},${h-14-(x.v-mn)/sp*(h-30)}`).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Gráfica de ${esc(PD[k][0])}"><polyline points="${pts}" fill="none" stroke="#35d6ff" stroke-width="2"/><text x="10" y="10" fill="#8fb3c4" font-size="9">máx ${fm(mx,3)}</text><text x="10" y="${h-1}" fill="#8fb3c4" font-size="9">mín ${fm(mn,3)}</text></svg>`}

function taskRows(t,lim){const d0=new Date(today()+'T00:00').getTime();
 return t.tasks.map(k=>({k,dd:Math.round((new Date(k.last+'T00:00').getTime()+k.e*864e5-d0)/864e5)})).sort((a,b)=>a.dd-b.dd).slice(0,lim||99)}

function mk(){const id=uid();S.tanks.push({id,name:$('#nn').value.trim()||'Mi acuario',type:$('#nt').value,shape:'rect',borde:5,habs:[],params:[],tasks:dTasks()});S.cur=id;creating=false;tab='acuario';save();render()}
function delT(){if(!delAsk){delAsk=true;return render()}S.tanks=S.tanks.filter(x=>x.id!==S.cur);S.cur=S.tanks[0]?S.tanks[0].id:null;delAsk=false;save();render()}
function addHab(){const t=T();t.habs.push({id:uid(),sp:selSp,nick:$('#hn').value.trim(),size:$('#hs')?$('#hs').value:'',loc:$('#hl')?$('#hl').value.trim():'',d:today()});save();render()}
function rmHab(id){const t=T();t.habs=t.habs.filter(h=>h.id!==id);save();render()}
function addPar(){const t=T(),v=parseFloat($('#pv').value);if(isNaN(v))return toast('Introduce un valor numérico.');
 t.params.push({id:uid(),k:selPar,v,d:$('#pd').value||nowL(),t:$('#pt').value.trim()});save();render()}
function rmPar(id){const t=T();t.params=t.params.filter(p=>p.id!==id);save();render()}
function doneT(id){const k=T().tasks.find(x=>x.id===id);k.last=today();save();render()}
function rmT(id){const t=T();t.tasks=t.tasks.filter(x=>x.id!==id);save();render()}
function addT(){const n=$('#tn').value.trim(),e=parseInt($('#te').value);if(!n||!(e>0))return toast('Indica el nombre y los días.');T().tasks.push({id:uid(),n,e,last:today()});save();render()}
if(!T()&&S.tanks.length)S.cur=S.tanks[0].id;
tab=S.tanks.length?'panel':'acuario';render();resched();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
