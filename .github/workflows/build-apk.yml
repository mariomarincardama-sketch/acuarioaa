name: Construir APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir www && cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - name: Icono
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp www/icon-192.png "$d/ic_launcher.png"
            cp www/icon-192.png "$d/ic_launcher_round.png"
            cp www/icon-192.png "$d/ic_launcher_foreground.png"
          done
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ReefKeeper-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
